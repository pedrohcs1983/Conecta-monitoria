<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1E3F">
<title>Conecta Monitoria • Instituto Vértice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--abissal:#0B1E3F;--cobalto:#1D4ED8;--ciano:#06B6D4;--violeta:#6D28D9;--turquesa:#0F766E;--gelo:#F1F6FB;--linha:#D6E2EF;--mut:#3E5573}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--gelo);color:var(--abissal);line-height:1.5}
h1,h2,h3,.logo{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
h1{font-size:1.6rem;margin:.3em 0 .6em;font-weight:800}
h2{font-size:1.15rem;margin:1.4em 0 .6em;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;background:var(--ciano);transform:rotate(45deg);flex:none}
h3{margin:0;font-size:1.05rem}
:focus-visible{outline:3px solid var(--ciano);outline-offset:2px}
button{font:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.top{background:var(--abissal);position:sticky;top:0;z-index:20;box-shadow:0 2px 0 var(--ciano)}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px}
.logo{background:none;border:0;color:#fff;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;text-align:left;line-height:1.15}
.logo small{display:block;font-family:Inter;font-weight:500;font-size:11px;color:#9FE7F5;letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;flex-wrap:wrap;gap:4px}
.nav{background:none;border:0;padding:8px 12px;border-radius:6px;font-size:14px;color:#D4E4F7}
.nav:hover{background:#ffffff14;color:#fff}
.nav[aria-current]{background:var(--cobalto);color:#fff;font-weight:600}
.nav[data-a=logout]{color:#FCA5A5!important}
.card{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:18px;box-shadow:0 1px 2px #0B1E3F0D;transition:box-shadow .2s,transform .2s;color:var(--abissal)}
button.card:hover,article.card:hover{box-shadow:0 8px 24px #1D4ED81F;transform:translateY(-2px)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:9px 16px;font-size:14px;font-weight:600;min-height:40px;border:1px solid transparent;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.p{background:var(--cobalto);color:#fff}
.s{background:#fff;border-color:#9DB2CC;color:var(--abissal)}
.d{background:#B91C1C;color:#fff}
.g{background:var(--turquesa);color:#fff}
.y{background:var(--ciano);color:var(--abissal)}
.link{background:none;border:0;padding:0;color:var(--cobalto);text-decoration:underline;text-underline-offset:3px}
.in{width:100%;border:1px solid #9DB2CC;border-radius:6px;padding:9px 11px;font:inherit;background:#fff;color:var(--abissal)}
.in:focus{border-color:var(--cobalto)}
label.f{display:block}label.f>span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.hint{font-size:12px;color:var(--mut)}.mut{color:var(--mut);font-size:14px;margin:4px 0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sb{justify-content:space-between}
.badge{border:1px solid;border-radius:4px;padding:2px 10px;font-size:12px;font-weight:600}
.b-pendente{background:#FEF3C7;color:#78350F}.b-aceita{background:#CCFBF1;color:#134E4A}.b-recusada{background:#FEE2E2;color:#7F1D1D}
.b-cancelada{background:#E2E8F0;color:#1E293B}.b-concluida{background:#EDE9FE;color:#4C1D95}
.chip{font-size:12px;background:#E0F2FE;border:1px solid #BAE6FD;color:#0C4A6E;border-radius:4px;padding:2px 8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--linha);margin-bottom:16px}
.tab{background:none;border:0;padding:9px 14px;border-radius:6px 6px 0 0;font-size:14px;color:var(--mut)}
.tab[aria-selected=true]{background:var(--violeta);color:#fff;font-weight:600}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:14px;padding:40px 28px;
  background:radial-gradient(circle at 90% 10%,#06B6D455 0,transparent 40%),radial-gradient(circle at 75% 100%,#6D28D966 0,transparent 45%),linear-gradient(135deg,#0B1E3F,#13306B)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border:2px solid #06B6D466;transform:rotate(45deg)}
.hero>*{position:relative;z-index:1}
.hero p{color:#CFE3FA!important}
.empty{text-align:center;border:2px dashed #B7CBE0;border-radius:10px;padding:26px;color:var(--mut);background:#fff}
.alert{background:#FEF2F2;border:1px solid #DC2626;color:#7F1D1D;border-radius:6px;padding:10px;font-size:14px}
.info{background:#E0F2FE;border:1px solid #38BDF8;color:#0C4A6E;border-radius:6px;padding:10px;font-size:13px}
.mbg{position:fixed;inset:0;background:#0B1E3FB3;backdrop-filter:blur(3px);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;border-top:5px solid var(--ciano)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;width:92%;max-width:440px}
.toast{padding:12px 16px;border-radius:8px;color:#fff;font-weight:500;box-shadow:0 8px 24px #0B1E3F40}
.pick{border:1px solid #9DB2CC;background:#fff;border-radius:6px;padding:8px 10px;text-align:left;font-size:14px;color:var(--abissal)}
.pick:hover:not(:disabled){border-color:var(--cobalto)}
.pick[aria-pressed=true]{background:var(--cobalto);border-color:var(--cobalto);color:#fff}
.pick:disabled{opacity:.5;cursor:not-allowed}
.unread{border-left:5px solid var(--ciano)}
ul.clean{list-style:none;padding:0;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#E8F0F9;font-family:Sora,Inter,sans-serif;font-size:13px}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--linha)}
fieldset{border:1px solid var(--linha);border-radius:8px}
footer.wrap{margin-top:32px;border-top:1px solid var(--linha);padding-top:14px}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;min-height:42px;background:#fff;border:1px solid #9DB2CC;border-radius:6px;font-weight:600;color:var(--abissal)}
.gbtn:hover{border-color:var(--cobalto);box-shadow:0 2px 8px #1D4ED81F}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:4px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--linha)}
.area{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violeta)}
.areaCard{text-align:left;border-top:4px solid var(--ciano)}
</style>
</head>
<body>
<div id="app"></div><div id="toast" aria-live="polite"></div>
<script>
/* ========== UTILITÁRIOS ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),now=()=>new Date().toISOString();
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const tmin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},tstr=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fD=s=>pD(s).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const fDT=i=>new Date(i).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const byId=(a,i)=>a.find(x=>x.id===+i);
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const ST={pendente:'⏳ Pendente',aceita:'✔ Aceita',recusada:'✖ Recusada',cancelada:'⊘ Cancelada',concluida:'★ Concluída'};
const ACT=['pendente','aceita'],CANCEL_H=2;
const LOGO=`<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 37 20 20 37 3 20Z" fill="none" stroke="#06B6D4" stroke-width="3"/><path d="M12 14 20 28 28 14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Conecta Monitoria<small>Instituto Vértice</small></span>`;

/* ========== CONFIGURAÇÃO ========== */
const KEY='conecta_monitoria_v3';let db;
// Client ID OAuth do Google: cole aqui OU configure em Administração › Integrações
const GOOGLE_CLIENT_ID=localStorage.getItem('gcid')||'';
const AREAS=['Exatas','Ciências da Natureza','Ciências Humanas e Sociais','Linguagens','Tecnologia'];
const areaOf=o=>byId(db.subjects,o.subjectId)?.area||'';

/* ========== BANCO (localStorage) ========== */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const nid=()=>++db.seq;
const subj=i=>byId(db.subjects,i)?.name||'—';
function newReq(o,s,sid,date,msg){
  const t=now(),r={id:nid(),offerId:o.id,subject:subj(o.subjectId),monitorId:o.monitorId,studentId:sid,slotId:s.id,date,start:s.start,end:endOf(o,s),format:o.format,place:o.place,msg,status:'pendente',log:[{s:'pendente',at:t}],createdAt:t,updatedAt:t};
  db.requests.push(r);return r;
}
function seed(){
  db={seq:1,users:[],subjects:[],offers:[],requests:[],reviews:[],notifs:[],reports:[],outbox:[],session:null};
  const t=now();
  const SUBJ={'Exatas':['Matemática','Física','Estatística'],'Ciências da Natureza':['Química','Biologia'],
    'Ciências Humanas e Sociais':['História','Geografia','Filosofia','Sociologia'],'Linguagens':['Português','Redação','Inglês','Espanhol'],'Tecnologia':['Programação']};
  Object.entries(SUBJ).forEach(([a,l])=>l.forEach(n=>db.subjects.push({id:nid(),name:n,area:a})));
  const sb=n=>db.subjects.find(s=>s.name===n).id;
  const mu=(name,email,pw,turma,roles,admin=false)=>{const u={id:nid(),name,email,pw,turma,roles,admin,active:true,createdAt:t,updatedAt:t};db.users.push(u);return u};
  mu('Coordenação Escolar','admin@escola.exemplo','admin123','—',[],true);
  const ana=mu('Ana Souza','ana@escola.exemplo','ana123','3º Ano A',['monitor']);
  const bru=mu('Bruno Lima','bruno@escola.exemplo','bruno123','1º Ano B',['aluno']);
  const car=mu('Carla Mendes','carla@escola.exemplo','carla123','2º Ano C',['aluno','monitor']);
  const die=mu('Diego Ramos','diego@escola.exemplo','diego123','3º Ano B',['monitor']);
  const eli=mu('Elisa Prado','elisa@escola.exemplo','elisa123','3º Ano C',['monitor']);
  const fel=mu('Felipe Nunes','felipe@escola.exemplo','felipe123','2º Ano A',['aluno','monitor']);
  const gab=mu('Gabriela Rocha','gabriela@escola.exemplo','gabi123','3º Ano A',['monitor']);
  const mo=(m,s,desc,sl,dur,format,place,max,notes='')=>{const o={id:nid(),monitorId:m.id,subjectId:sb(s),desc,slots:sl.map(([day,start])=>({id:nid(),day,start})),dur,format,place,max,notes,active:true,createdAt:t,updatedAt:t};db.offers.push(o);return o};
  const o1=mo(ana,'Matemática','Funções, geometria analítica e revisão para o ENEM.',[[2,'14:00'],[4,'15:00']],60,'presencial','Biblioteca – sala 2',3,'Traga caderno.');
  const o2=mo(car,'Física','Cinemática e leis de Newton com exercícios.',[[1,'13:30'],[3,'14:00']],45,'online','https://meet.exemplo/fisica',5);
  mo(ana,'Estatística','Média, mediana, desvio-padrão e leitura de gráficos.',[[1,'16:00']],60,'presencial','Sala 14',4);
  mo(die,'Química','Estequiometria, ligações químicas e tabela periódica.',[[2,'10:00'],[4,'10:00']],60,'presencial','Laboratório de Ciências',4,'Uso de jaleco recomendado.');
  mo(die,'Biologia','Genética, ecologia e citologia com mapas mentais.',[[3,'16:00']],60,'online','https://meet.exemplo/bio',6);
  const oh=mo(eli,'História','Brasil República, Guerras Mundiais e Guerra Fria.',[[1,'14:00'],[3,'14:00']],60,'presencial','Sala 8',5);
  mo(eli,'Geografia','Geopolítica, climatologia e cartografia.',[[2,'16:00']],60,'online','https://meet.exemplo/geo',6);
  mo(eli,'Filosofia','Ética, filósofos clássicos e argumentação.',[[4,'19:00']],60,'online','https://meet.exemplo/filo',8);
  mo(eli,'Sociologia','Movimentos sociais, cidadania e desigualdade.',[[5,'19:00']],60,'online','https://meet.exemplo/socio',8);
  mo(fel,'Português','Gramática, interpretação de texto e literatura.',[[2,'08:00']],50,'presencial','Biblioteca – sala 1',4);
  mo(fel,'Redação','Estrutura dissertativa e as 5 competências do ENEM.',[[4,'14:00'],[6,'09:00']],90,'presencial','Sala 3',3,'Traga uma redação para correção.');
  mo(fel,'Inglês','Conversação, reading e preparação para provas.',[[3,'19:00']],60,'online','https://meet.exemplo/ingles',5);
  mo(gab,'Espanhol','Vocabulário essencial e interpretação de textos.',[[5,'10:00']],60,'online','https://meet.exemplo/espanhol',5);
  mo(ana,'Programação','Introdução a HTML, CSS e JavaScript.',[[5,'14:00']],90,'online','https://meet.exemplo/prog',4);
  const nd=(day,dir)=>{for(let i=1;i<=7;i++){const d=addD(today(),i*dir);if(d.getDay()===day)return ymd(d)}};
  newReq(o2,o2.slots[0],bru.id,nd(1,1),'Dúvida em MRU.');
  const r=newReq(o1,o1.slots[1],bru.id,nd(4,-1),'');r.status='concluida';r.log.push({s:'aceita',at:t},{s:'concluida',at:t});
  db.reviews.push({id:nid(),reqId:r.id,monitorId:ana.id,authorId:bru.id,rating:5,comment:'Explicação muito clara! (exemplo)',createdAt:t});
  const r2=newReq(oh,oh.slots[0],car.id,nd(1,-1),'');r2.status='concluida';r2.log.push({s:'aceita',at:t},{s:'concluida',at:t});
  db.reviews.push({id:nid(),reqId:r2.id,monitorId:eli.id,authorId:car.id,rating:5,comment:'Aula dinâmica, recomendo! (exemplo)',createdAt:t});
  db.notifs.push({id:nid(),userId:ana.id,text:'Bem-vinda ao Conecta Monitoria! (exemplo)',read:false,createdAt:t});
  save();
}

/* ========== REGRAS DE NEGÓCIO ========== */
const me=()=>{const u=byId(db.users,db.session);return u&&u.active?u:null};
const has=(u,r)=>u.roles.includes(r);
const endOf=(o,s)=>tstr(tmin(s.start)+o.dur);
const startAt=r=>{const d=pD(r.date),m=tmin(r.start);d.setHours(Math.floor(m/60),m%60);return d};
const used=(o,s,d)=>db.requests.filter(r=>r.offerId===o.id&&r.slotId===s.id&&r.date===d&&ACT.includes(r.status)).length;
function dates(o,s){const out=[],n=new Date();for(let i=0;i<21;i++){const d=addD(today(),i);if(d.getDay()!==s.day)continue;if(i===0&&tmin(s.start)<=n.getHours()*60+n.getMinutes())continue;out.push(ymd(d))}return out}
const clash=(uid,date,a,b)=>db.requests.some(r=>ACT.includes(r.status)&&r.date===date&&(r.studentId===uid||r.monitorId===uid)&&tmin(r.start)<tmin(b)&&tmin(a)<tmin(r.end));
function why(o,s,d){
  if(o.max-used(o,s,d)<=0)return 'Sem vagas';
  const u=me();if(!u)return null;
  if(db.requests.some(r=>r.studentId===u.id&&r.offerId===o.id&&r.slotId===s.id&&r.date===d&&ACT.includes(r.status)))return 'Já solicitado';
  if(clash(u.id,d,s.start,endOf(o,s)))return 'Conflito de horário';
  return null;
}
const rating=mid=>{const l=db.reviews.filter(r=>r.monitorId===mid);return{n:l.length,avg:l.length?l.reduce((a,r)=>a+r.rating,0)/l.length:0}};
const rtxt=mid=>{const r=rating(mid);return r.n?`${r.avg.toFixed(1)} ★ (${r.n})`:'sem avaliações'};
function notify(uid,text){
  db.notifs.unshift({id:nid(),userId:uid,text,read:false,createdAt:now()});
  const u=byId(db.users,uid);if(u)db.outbox.push({to:u.email,text,status:'fila – e-mail desativado no protótipo',at:now()});
  db.outbox=db.outbox.slice(-100);
}
function setSt(r,s,note=''){r.status=s;r.updatedAt=now();r.log.push({s,at:now(),note})}
function overlap(uid,slots,dur,ex){
  const mine=slots.map(s=>({d:s.day,a:tmin(s.start),b:tmin(s.start)+dur}));
  const all=[...mine,...db.offers.filter(o=>o.monitorId===uid&&o.id!==ex&&o.active).flatMap(o=>o.slots.map(s=>({d:s.day,a:tmin(s.start),b:tmin(s.start)+o.dur})))];
  for(let i=0;i<mine.length;i++)for(let j=i+1;j<all.length;j++)
    if(all[i].d===all[j].d&&all[i].a<all[j].b&&all[j].a<all[i].b)return `Horários sobrepostos em ${DAYS[all[i].d]} às ${tstr(all[i].a)}.`;
  return null;
}
function canCancel(r){
  const u=me().id,h=(startAt(r)-new Date())/36e5;
  if(r.status==='pendente')return r.studentId===u;
  if(r.status!=='aceita')return false;
  return r.studentId===u?h>=CANCEL_H:r.monitorId===u&&h>0;
}
function reminders(u){
  db.requests.filter(r=>r.status==='aceita'&&(r.studentId===u.id||r.monitorId===u.id)).forEach(r=>{
    const h=(startAt(r)-new Date())/36e5,k='rem'+u.id;
    if(h>0&&h<=24&&!r[k]){r[k]=1;notify(u.id,`Lembrete: ${r.subject} em ${fD(r.date)} às ${r.start}.`)}
  });
}
function cancelActive(o,why){
  db.requests.filter(r=>r.offerId===o.id&&ACT.includes(r.status)).forEach(r=>{setSt(r,'cancelada',why);notify(r.studentId,`Sua solicitação de ${r.subject} (${fD(r.date)}) foi cancelada: ${why}.`)});
}

/* ========== ESTADO E UI ========== */
const S={v:'home',p:null,tab:'rec',atab:'res',uq:'',f:{q:'',area:'',day:'',period:'',format:'',vagas:false},sel:null,modal:null,draft:null,reset:null};
let tt;
function toast(m,ok=true){$('#toast').innerHTML=`<div class="toast" role="${ok?'status':'alert'}" style="background:${ok?'#0F766E':'#991b1b'}">${ok?'✔':'⚠'} ${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>$('#toast').innerHTML='',4000)}
const field=(l,i,h='')=>`<label class="f"><span>${l}</span>${i}${h?`<span class="hint">${h}</span>`:''}</label>`;
const badge=s=>`<span class="badge b-${s}">${ST[s]}</span>`;
const stars=n=>`<span role="img" aria-label="${n} de 5" style="color:#b45309">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`;
const empty=(t,s='')=>`<div class="empty"><p><strong>${t}</strong></p>${s?`<p class="mut">${s}</p>`:''}</div>`;
const opts=(l,v)=>l.map(([k,t])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(t)}</option>`).join('');
const tabs=(l,cur,a)=>`<div role="tablist" class="tabs">${l.map(([k,t])=>`<button role="tab" class="tab" aria-selected="${k===cur}" data-a="${a}" data-id="${k}">${t}</button>`).join('')}</div>`;
const nf=()=>`<div class="card">${empty('Conteúdo não encontrado','Pode ter sido removido ou você não tem acesso.')}<p><button class="btn p" data-a="go" data-v="catalog">Ir ao catálogo</button></p></div>`;
const ferr=(f,m)=>{f.querySelector('.err').innerHTML=`<div class="alert" role="alert">⚠ ${esc(m)}</div>`};

function header(u){
  const un=u?db.notifs.filter(n=>n.userId===u.id&&!n.read).length:0;
  const items=!u?[['catalog','Catálogo'],['login','Entrar'],['register','Cadastrar-se']]:u.admin?[['admin','Administração'],['catalog','Catálogo']]:
    [['dash','Painel'],['catalog','Catálogo'],['my','Minhas monitorias'],...(has(u,'monitor')?[['offers','Minhas ofertas']]:[]),['notifs',`Notificações${un?` (${un})`:''}`],['profile','Perfil']];

function modal(){

    ${field('Comentário','<textarea name="comment" rows="3" maxlength="300" class="in"></textarea>','Mínimo de 5 caracteres.')}${bt('<button class="btn p">Enviar</button>')}</form>`}

  if(m.t==='gdemo'){t='Continuar com Google';b=`<form data-f="gdemo" class="grid" novalidate><div class="err"></div><p class="info">Modo simulação. Para o login real, o administrador configura o Client ID em <b>Administração › Integrações</b>.</p>

function render(){

function go(v,p=null){

const G_ICON=`<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6C44.1 38 46.5 31.8 46.5 24.5z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>`;
const gFallback=()=>`<button type="button" class="gbtn" data-a="gdemo">${G_ICON} Continuar com Google</button>`;
const gBlock=()=>`<div id="gbtn" style="display:flex;justify-content:center;min-height:42px">${GOOGLE_CLIENT_ID?'<span class="hint">Carregando Google…</span>':gFallback()}</div><div class="or">ou com e-mail</div>`;
const jwt=t=>JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')));
function gLogin(email,name,pic){
  email=email.toLowerCase();let u=db.users.find(x=>x.email===email);const nw=!u;
  if(u&&!u.active)return toast('Conta desativada. Procure a coordenação.',false);
  if(!u){u={id:nid(),name,email,pw:null,provider:'google',pic:pic||'',turma:'A definir',roles:['aluno'],admin:false,active:true,createdAt:now(),updatedAt:now()};db.users.push(u);notify(u.id,'Conta criada com Google. Informe sua turma em Perfil.')}
  else if(!u.provider){u.provider='google';u.updatedAt=now()}
  db.session=u.id;S.modal=null;toast(`Bem-vindo(a), ${u.name.split(' ')[0]}!`);go(u.admin?'admin':nw?'profile':'dash');
}
function gCallback(r){
  try{const p=jwt(r.credential);
    if(p.aud!==GOOGLE_CLIENT_ID||!['accounts.google.com','https://accounts.google.com'].includes(p.iss))return toast('Token do Google inválido.',false);
    if(p.exp*1000<Date.now())return toast('Sessão Google expirada. Tente novamente.',false);
    if(!p.email_verified)return toast('E-mail Google não verificado.',false);
    gLogin(p.email,p.name||p.email.split('@')[0],p.picture);
  }catch(e){toast('Falha no login com Google.',false)}
}
function mountG(){
  const el=$('#gbtn');if(!el||!GOOGLE_CLIENT_ID)return;
  if(!window.google?.accounts?.id){if(mountG.failed)el.innerHTML=gFallback();return}
  if(location.protocol==='file:'){el.innerHTML=`<p class="info" style="margin:0">Abra o site por um servidor (ex.: Live Server) para usar o login Google.</p>`;return}
  if(!mountG.ok){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:gCallback,ux_mode:'popup',auto_select:false,cancel_on_tap_outside:true});mountG.ok=1}
  el.innerHTML='';google.accounts.id.renderButton(el,{theme:'outline',size:'large',shape:'rectangular',text:'continue_with',locale:'pt-BR',width:Math.min(360,el.offsetWidth||360)});
}

function filtered(){

    if(f.format&&o.format!==f.format)return false;
    if(f.area&&areaOf(o)!==f.area)return false;
    if(f.day!==''&&!o.slots.some(s=>s.day===+f.day))return false;
    if(f.period&&!o.slots.some(s=>{const h=tmin(s.start)/60;return f.period==='manha'?h<12:f.period==='tarde'?h>=12&&h<18:h>=18}))return false;

    return true;
  });
}

const myReq=i=>{const u=me(),r=byId(db.requests,i);return u&&r&&(r.studentId===u.id||r.monitorId===u.id)?r:null};
const myOffer=i=>{const u=me(),o=byId(db.offers,i);return u&&o&&(o.monitorId===u.id||u.admin)?o:null};
const ask=(title,text,act,id)=>{S.modal={t:'confirm',title,text,act,id};render()};
const A={
  go:d=>{if(d.v==='my'&&d.id)S.tab=d.id;go(d.v,d.id?(isNaN(d.id)?null:+d.id):null)},
  close:()=>{S.modal=null;render()},
  gdemo:()=>{S.modal={t:'gdemo'};render()},
  area:d=>{S.f={...S.f,area:d.id};go('catalog')},
  clearGcid:()=>{localStorage.removeItem('gcid');location.reload()},
  demo:d=>{const u=db.users.find(x=>x.email===d.id);if(!u)return toast('Conta não encontrada. Restaure os dados.',false);if(!u.active)return toast('Conta desativada.',false);db.session=u.id;toast(`Bem-vindo(a), ${u.name.split(' ')[0]}!`);go(u.admin?'admin':'dash')},
  logout:()=>{db.session=null;try{window.google?.accounts?.id?.disableAutoSelect()}catch(e){}toast('Você saiu da conta.');go('home')},
  askReset:()=>ask('Restaurar demonstração','Todos os dados atuais serão apagados e substituídos pelos exemplos.','doReset',0),
  doReset:()=>{seed();S.modal=null;toast('Dados restaurados.');go('home')},
  tab:d=>{S.tab=d.id;render()},atab:d=>{S.atab=d.id;render()},
  pick:d=>{S.sel={oid:+d.oid,sid:+d.sid,date:d.date};render()},
  askReq:()=>{if(!me()){toast('Entre para solicitar.',false);return go('login')}if(!has(me(),'aluno'))return toast('Ative o perfil de estudante em Perfil.',false);S.modal={t:'req'};render()},
  accept:d=>{const r=myReq(d.id);if(!r||r.monitorId!==me().id||r.status!=='pendente')return;setSt(r,'aceita');notify(r.studentId,`${me().name} aceitou seu pedido de ${r.subject} (${fD(r.date)} às ${r.start}).`);toast('Pedido aceito.');render()},
  refuse:d=>ask('Recusar pedido','O estudante será notificado.','doRefuse',d.id),
  doRefuse:d=>{const r=myReq(d.id);if(!r||r.status!=='pendente')return;setSt(r,'recusada');notify(r.studentId,`Seu pedido de ${r.subject} (${fD(r.date)}) foi recusado.`);S.modal=null;toast('Pedido recusado.');render()},
  askCancel:d=>ask('Cancelar monitoria','A outra parte será notificada.','doCancel',d.id),
  doCancel:d=>{const r=myReq(d.id);if(!r||!canCancel(r))return toast('Cancelamento não permitido.',false);setSt(r,'cancelada',`por ${me().name}`);notify(r.studentId===me().id?r.monitorId:r.studentId,`A monitoria de ${r.subject} (${fD(r.date)}) foi cancelada.`);S.modal=null;toast('Cancelada.');render()},
  complete:d=>{const r=myReq(d.id);if(!r||r.status!=='aceita'||startAt(r)>new Date())return;setSt(r,'concluida');notify(r.studentId===me().id?r.monitorId:r.studentId,`A monitoria de ${r.subject} foi marcada como concluída.`);toast('Monitoria concluída!');render()},
  askReview:d=>{S.modal={t:'review',id:+d.id};render()},
  askReport:d=>{S.modal={t:'report',id:+d.id};render()},
  edit:d=>{const o=myOffer(d.id);if(!o)return;S.draft=JSON.parse(JSON.stringify({id:o.id,subjectId:o.subjectId,desc:o.desc,slots:o.slots,dur:o.dur,format:o.format,place:o.place,max:o.max,notes:o.notes}));S.v='form';render()},
  addSlot:()=>{syncDraft();S.draft.slots.push({id:null,day:1,start:'14:00'});render()},
  rmSlot:d=>{syncDraft();S.draft.slots.splice(+d.id,1);render()},
  toggleOffer:d=>{const o=myOffer(d.id);if(!o)return;
    if(!o.active){const e=overlap(o.monitorId,o.slots,o.dur,o.id);if(e)return toast(e,false)}else cancelActive(o,'oferta pausada');
    o.active=!o.active;o.updatedAt=now();toast(o.active?'Oferta reativada.':'Oferta pausada.');render()},
  askDel:d=>ask('Excluir oferta','Solicitações ativas serão canceladas e os estudantes notificados.','doDel',d.id),
  doDel:d=>{const o=myOffer(d.id);if(!o)return;cancelActive(o,'oferta excluída');db.offers.splice(db.offers.indexOf(o),1);S.modal=null;toast('Oferta excluída.');render()},
  readN:d=>{const n=byId(db.notifs,d.id);if(n)n.read=true;render()},
  readAll:()=>{db.notifs.forEach(n=>{if(n.userId===me().id)n.read=true});render()},
  openN:d=>{const n=byId(db.notifs,d.id);if(n)n.read=true;go('my')},
  toggleUser:d=>{if(!me()?.admin)return;const u=byId(db.users,d.id);if(!u||u.admin)return;u.active=!u.active;u.updatedAt=now();
    if(!u.active){db.offers.filter(o=>o.monitorId===u.id).forEach(o=>{cancelActive(o,'monitor desativado');o.active=false});
      db.requests.filter(r=>r.studentId===u.id&&ACT.includes(r.status)).forEach(r=>{setSt(r,'cancelada','conta desativada');notify(r.monitorId,`Pedido de ${r.subject} cancelado (conta do estudante desativada).`)})}
    toast(u.active?'Conta ativada.':'Conta desativada.');render()},
  delSubject:d=>{if(db.offers.some(o=>o.subjectId===+d.id))return toast('Há ofertas usando esta matéria.',false);db.subjects=db.subjects.filter(s=>s.id!==+d.id);render()},
  rmReview:d=>{const r=byId(db.reports,d.id);db.reviews=db.reviews.filter(x=>x.id!==r.reviewId);r.status='resolvida';toast('Avaliação removida.');render()},
  dismiss:d=>{byId(db.reports,d.id).status='descartada';render()}
};

/* ========== FORMULÁRIOS ========== */
const val=(f,n)=>(f[n]?.value||'').trim();
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const roles=f=>[...f.querySelectorAll('[name=role]:checked')].map(x=>x.value);
const F={
  login:f=>{const e=val(f,'email').toLowerCase(),u=db.users.find(x=>x.email===e);
    if(u&&u.provider==='google'&&!u.pw)return 'Esta conta usa o Google. Clique em "Continuar com Google".';
    if(!u||u.pw!==f.pw.value)return 'E-mail ou senha incorretos.';if(!u.active)return 'Conta desativada. Procure a coordenação.';
    db.session=u.id;toast('Login realizado.');go(u.admin?'admin':'dash')},
  gdemo:f=>{const e=val(f,'email').toLowerCase(),n=val(f,'name');
    if(!/^[^\s@]+@gmail\.com$/.test(e))return 'Informe um endereço @gmail.com válido.';
    if(!db.users.some(u=>u.email===e)&&n.length<3)return 'Informe seu nome.';
    gLogin(e,n||e.split('@')[0])},
  gcid:f=>{const c=val(f,'cid');if(c&&!/^[\w-]+\.apps\.googleusercontent\.com$/.test(c))return 'Client ID inválido. Deve terminar em .apps.googleusercontent.com';
    c?localStorage.setItem('gcid',c):localStorage.removeItem('gcid');location.reload()},
  register:f=>{const name=val(f,'name'),email=val(f,'email').toLowerCase(),turma=val(f,'turma'),r=roles(f);
    if(name.length<3)return 'Informe o nome completo.';if(!okEmail(email))return 'E-mail inválido.';
    if(db.users.some(u=>u.email===email))return 'E-mail já cadastrado.';if(!turma)return 'Informe a turma.';
    if(f.pw.value.length<6)return 'A senha deve ter ao menos 6 caracteres.';if(!r.length)return 'Escolha ao menos uma forma de participação.';
    const u={id:nid(),name,email,pw:f.pw.value,turma,roles:r,admin:false,active:true,createdAt:now(),updatedAt:now()};
    db.users.push(u);db.session=u.id;notify(u.id,'Conta criada! Explore o catálogo de monitorias.');toast('Conta criada!');go('dash')},
  forgot:f=>{const e=val(f,'email').toLowerCase();if(!okEmail(e))return 'E-mail inválido.';S.reset={email:e,code:String(Math.floor(1e5+Math.random()*9e5))};render()},
  resetpw:f=>{if(val(f,'code')!==S.reset.code)return 'Código incorreto.';if(f.pw.value.length<6)return 'A senha deve ter ao menos 6 caracteres.';
    const u=db.users.find(x=>x.email===S.reset.email);if(u){u.pw=f.pw.value;u.updatedAt=now()}S.reset=null;toast('Senha redefinida. Faça login.');go('login')},
  req:f=>{const u=me(),{oid,sid,date}=S.sel,o=byId(db.offers,oid),s=o?.slots.find(x=>x.id===sid);
    if(!o||!o.active||!s)return 'Monitoria indisponível.';if(o.monitorId===u.id)return 'Não é possível solicitar a própria monitoria.';
    if(!dates(o,s).includes(date))return 'Horário fora da disponibilidade.';const w=why(o,s,date);if(w)return w+'.';
    const r=newReq(o,s,u.id,date,val(f,'msg').slice(0,300));notify(o.monitorId,`Nova solicitação de ${u.name}: ${r.subject} em ${fD(date)} às ${r.start}.`);
    S.sel=null;S.tab='env';toast('Pedido enviado! Aguarde a resposta.');go('my')},
  review:f=>{const r=myReq(S.modal.id),c=val(f,'comment');if(!r||r.status!=='concluida'||r.studentId!==me().id)return 'Avaliação indisponível.';
    if(c.length<5)return 'Escreva um comentário (mín. 5 caracteres).';if(db.reviews.some(x=>x.reqId===r.id))return 'Já avaliada.';
    db.reviews.push({id:nid(),reqId:r.id,monitorId:r.monitorId,authorId:me().id,rating:+f.rating.value,comment:c,createdAt:now()});
    notify(r.monitorId,`Você recebeu uma nova avaliação em ${r.subject}.`);S.modal=null;toast('Obrigado pela avaliação!');render()},
  report:f=>{const c=val(f,'reason');if(c.length<10)return 'Descreva o motivo (mín. 10 caracteres).';
    db.reports.push({id:nid(),reviewId:S.modal.id,by:me().id,reason:c,status:'aberta',createdAt:now()});
    db.users.filter(u=>u.admin).forEach(a=>notify(a.id,'Nova denúncia de avaliação para análise.'));S.modal=null;toast('Denúncia enviada.');render()},
  offer:f=>{syncDraft();const d=S.draft,u=me();
    if(d.desc.trim().length<10)return 'Descreva os assuntos (mín. 10 caracteres).';
    if(!(d.dur>=15&&d.dur<=180))return 'Duração entre 15 e 180 minutos.';if(!(d.max>=1&&d.max<=30))return 'Participantes entre 1 e 30.';
    if(!d.place.trim())return 'Informe o local ou link.';if(d.slots.some(s=>!s.start))return 'Preencha todos os horários.';
    if(tmin(d.slots.reduce((m,s)=>s.start>m?s.start:m,'00:00'))+d.dur>1440)return 'O horário ultrapassa a meia-noite.';
    const e=overlap(u.id,d.slots,d.dur,d.id);if(e)return e;
    const t=now(),slots=d.slots.map(s=>({id:s.id||nid(),day:s.day,start:s.start}));
    if(d.id){const o=myOffer(d.id);if(!o)return 'Oferta não encontrada.';
      const keep=slots.map(s=>s.id+'|'+s.day+'|'+s.start);
      db.requests.filter(r=>r.offerId===o.id&&ACT.includes(r.status)).forEach(r=>{const s=o.slots.find(x=>x.id===r.slotId);
        if(!s||!keep.includes(s.id+'|'+s.day+'|'+s.start)||o.dur!==d.dur){setSt(r,'cancelada','horário alterado pelo monitor');notify(r.studentId,`Sua solicitação de ${r.subject} (${fD(r.date)}) foi cancelada: horário alterado.`)}
        else{r.place=d.place;r.format=d.format}});
      Object.assign(o,{subjectId:d.subjectId,desc:d.desc.trim(),slots,dur:d.dur,format:d.format,place:d.place.trim(),max:d.max,notes:d.notes.trim(),updatedAt:t})}
    else db.offers.push({id:nid(),monitorId:u.id,subjectId:d.subjectId,desc:d.desc.trim(),slots,dur:d.dur,format:d.format,place:d.place.trim(),max:d.max,notes:d.notes.trim(),active:true,createdAt:t,updatedAt:t});
    S.draft=null;toast('Oferta salva!');go('offers')},
  profile:f=>{const u=me(),name=val(f,'name'),turma=val(f,'turma'),r=roles(f);
    if(name.length<3)return 'Informe o nome.';if(!turma)return 'Informe a turma.';if(!r.length)return 'Escolha ao menos um perfil.';
    if(f.pw.value&&f.pw.value.length<6)return 'A senha deve ter ao menos 6 caracteres.';
    if(has(u,'monitor')&&!r.includes('monitor')&&db.offers.some(o=>o.monitorId===u.id&&o.active))return 'Pause suas ofertas antes de deixar de ser monitor.';
    Object.assign(u,{name,turma,roles:r,updatedAt:now()});if(f.pw.value)u.pw=f.pw.value;toast('Perfil atualizado.');render()},
  subject:f=>{const n=val(f,'name');if(n.length<2)return 'Informe o nome da matéria.';
    if(db.subjects.some(s=>norm(s.name)===norm(n)))return 'Matéria já existe.';db.subjects.push({id:nid(),name:n,area:f.area.value});toast('Matéria adicionada.');render()}
};

/* ========== EVENTOS ========== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;e.preventDefault();A[b.dataset.a]?.(b.dataset)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const m=F[f.dataset.f]?.(f);if(typeof m==='string')ferr(f,m)});
function live(e){const t=e.target,k=t.dataset?.live;if(!k)return;
  if(k==='cat'){S.f[t.name]=t.type==='checkbox'?t.checked:t.value;$('#results').innerHTML=results()}
  if(k==='usr'){S.uq=t.value;$('#ulist').innerHTML=usersTable()}}
document.addEventListener('input',live);document.addEventListener('change',live);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
addEventListener('storage',e=>{if(e.key===KEY){try{db=JSON.parse(e.newValue)}catch(_){}render()}});

/* ========== INICIALIZAÇÃO ========== */
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
if(!db||!db.users)seed();
render();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="mountG()" onerror="mountG.failed=1;mountG()"></script>
